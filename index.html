    <script>
        // =========================================================================
        // 1. CURRICULUM DATA (ALL 15 EXPERIMENTS + 40 VIVA QUESTIONS)
        // =========================================================================
        const EXPERIMENTS = [
            {
                id: 'exp1', no: 'Ex. No. 01', title: 'Response of First Order System',
                subtitle: '3D Cylindrical Liquid Level Tank, Rotameter & 63.2% Time Constant',
                category: 'Open Loop Dynamics', icon: 'fa-water',
                aim: 'To verify the dynamic response of a First Order System (Liquid Level System) for a step change in inflow rate and to calculate the time constant (τ) and resistance (R) of the process tank.',
                apparatus: ['First Order Liquid Level Process Tank (Cylindrical)', 'Water Reservoir & Centrifugal Pump', 'Calibrated Rotameter (0–500 LPH)', 'Inlet & Outlet Hand Control Valves', 'Graduated Level Scale & Stopwatch'],
                procedure: [
                    'Switch ON the pump and set initial inflow of water to X LPH in the rotameter (click the 3D inlet valve handwheel or use the console slider).',
                    'Wait until the liquid level in the 3D process tank reaches steady state (h₀), where inflow equals outflow.',
                    'Suddenly increase the inflow rate to Y LPH (step input) and observe the live rising liquid level h(t) in the 3D tank.',
                    'Record tank level vs time until new steady state (h∞) is achieved and compute τ = R × C using the 63.2% method.'
                ]
            },
            {
                id: 'exp2', no: 'Ex. No. 02', title: 'Response of Non-Interacting Level System',
                subtitle: '3D Cascaded Two-Tank Rig Without Back-Pressure Coupling',
                category: 'Open Loop Dynamics', icon: 'fa-layer-group',
                aim: 'To verify the step response of a Non-Interacting two-tank liquid level system and determine the time constants (τ₁, τ₂) and resistances (R₁, R₂) of each tank.',
                apparatus: ['Two Cylindrical Process Tanks in Series (Non-Interacting)', 'Water Sump & Feed Pump', 'Rotameter (0–500 LPH) & Flow Valves', 'Level Scales on Tank 1 & Tank 2'],
                procedure: [
                    'Set steady inflow rate X LPH into the upper Tank 1. Allow Tank 1 and lower Tank 2 to reach initial steady levels h₁₀ and h₂₀.',
                    'Introduce a sudden step increase in inflow rate to Y LPH by clicking the 3D inlet valve or adjusting the slider.',
                    'Observe Tank 1 discharging freely into Tank 2 in 3D and note the sigmoidal S-shaped response of h₂(t).'
                ]
            },
            {
                id: 'exp3', no: 'Ex. No. 03', title: 'Response of Interacting Level System',
                subtitle: '3D Bottom-Coupled Two-Tank Rig with Inter-Tank Resistance R₁',
                category: 'Open Loop Dynamics', icon: 'fa-code-branch',
                aim: 'To verify the step response of an Interacting two-tank level system and calculate the effective time constants and resistances of each tank.',
                apparatus: ['Two Process Tanks Connected at Bottom via Interacting Valve', 'Feed Pump, Sump Tank & Rotameter', 'Discharge Valve & Level Scales'],
                procedure: [
                    'Open the bottom interconnecting valve between Tank 1 and Tank 2 and set initial flow X LPH.',
                    'Wait for steady-state levels h₁₀ and h₂₀ (h₁₀ > h₂₀), then apply a step increase to Y LPH.',
                    'Observe how Tank 2 loads Tank 1 through the bottom connecting pipe (q₁₂ = (h₁ − h₂)/R₁).'
                ]
            },
            {
                id: 'exp4', no: 'Ex. No. 04', title: 'Closed Loop Study on a Level System',
                subtitle: '3D Level Tank, LT (4–20 mA), DAC, I/P Converter & Pneumatic Valve',
                category: 'Closed Loop Calibration', icon: 'fa-sliders',
                aim: 'To study the closed-loop hardware components on a level system: Level Transmitter (4–20 mA), Digital-to-Analog Converter (DAC), I/P Converter (3–15 psi), and Pneumatic Control Valve.',
                apparatus: ['Level Control Analyzer 3D Station & PC', 'Air Compressor & Regulator (20 psi)', 'Level Transmitter, I/P Converter & Pneumatic Control Valve'],
                procedure: [
                    'Set air supply regulator pressure to 20 psi and invoke Manual Mode.',
                    'Vary tank level in steps (0–30 cm) and observe Level Transmitter current output (4–20 mA).',
                    'Step Manual Mode controller output across 0%, 25%, 50%, 75%, and 100% and watch the 3D pneumatic control valve stem move linearly.'
                ]
            },
            {
                id: 'exp5', no: 'Ex. No. 05', title: 'Closed Loop Study on a Flow System',
                subtitle: '3D Orifice Plate, Differential Pressure Transmitter & Valve Loop',
                category: 'Closed Loop Calibration', icon: 'fa-tachometer-alt',
                aim: 'To study the closed loop components on a flow system, verify square-root non-linearity of the Differential Pressure Flow Transmitter, and calibrate DAC, I/P converter, and control valve.',
                apparatus: ['Flow Control Analyzer 3D Pipeline with Orifice Plate & DPT', 'Air Compressor, Regulator (20 psi) & Pneumatic Control Valve'],
                procedure: [
                    'Vary pipeline flow rate across 0 to 500 LPH and measure the raw non-linear transmitter current X (mA).',
                    'Compute linearized transmitter output I_lin = 4 + 4√(X − 4) mA and compare with raw curve.',
                    'Step Manual Mode % (0–100%) and observe DAC (mA), I/P (psi), and 3D valve stem lift (%).'
                ]
            },
            {
                id: 'exp6', no: 'Ex. No. 06', title: 'Closed Loop Study on a Pressure System',
                subtitle: '3D Pressurized Vessel, PT Sensor, Compressor & Pneumatic Valve',
                category: 'Closed Loop Calibration', icon: 'fa-compress-arrows-alt',
                aim: 'To study the closed loop control components on a pressure system: Pressure Transmitter, DAC, I/P converter, and control valve position.',
                apparatus: ['Pressure Control Analyzer 3D Vessel', 'Air Compressor, Regulator (20 psi), Pressure Gauge & Control Valve'],
                procedure: [
                    'Vary vessel pressure from 0 to 50 psi in steps and record Pressure Transmitter output X (mA) and linearized scale.',
                    'In Manual Mode, step controller output through 0%, 25%, 50%, 75%, and 100% and observe 3D actuator motion.'
                ]
            },
            {
                id: 'exp7', no: 'Ex. No. 07', title: 'Tuning of a Level System',
                subtitle: '3D Closed-Loop Level Rig: ON/OFF, P, PI, PD & PID Controller Modes',
                category: 'Controller Tuning', icon: 'fa-wave-square',
                aim: 'To study and compare the closed-loop transient performance, offset, and settling time of ON-OFF, P, PI, PD, and PID controllers on a Liquid Level System (Set Point = 15 cm).',
                apparatus: ['Computerized Level Process Control 3D Trainer', 'Air Compressor & Regulator (20 psi)', 'Level Transmitter, I/P Converter & Pneumatic Control Valve'],
                procedure: [
                    'Set Set Point (SP) = 15 cm. Test ON/OFF mode (Gap = 5 cm), P (Kp = 2), PI (Kp = 2, Ki = 0.01), PD (Kp = 2, Kd = 0.1), and PID (Kp = 2, Ki = 0.01, Kd = 0.1).',
                    'Watch the 3D pneumatic control valve stem modulate automatically in real time as the tank level approaches 15 cm.'
                ]
            },
            {
                id: 'exp8', no: 'Ex. No. 08', title: 'Tuning of a Flow System',
                subtitle: '3D Pipeline Flow Rig: ON/OFF, P, PI, PD & PID Controller Tuning',
                category: 'Controller Tuning', icon: 'fa-wind',
                aim: 'To evaluate the dynamic performance of ON-OFF, P, PI, PD, and PID controller modes on a Flow Process System (Set Point = 250 LPH).',
                apparatus: ['Computerized Flow Process Control 3D Trainer', 'Orifice Plate with DPT & Pneumatic Control Valve'],
                procedure: [
                    'Set Flow Set Point = 250 LPH. Run ON/OFF (Gap = 100 LPH), P (Kp = 2), PI (Kp = 2, Ki = 0.01), PD (Kp = 2, Kd = 0.1), and PID.',
                    'Observe the 3D rotameter float and control valve stem tracking the flow set point.'
                ]
            },
            {
                id: 'exp9', no: 'Ex. No. 09', title: 'Tuning of a Thermal System',
                subtitle: '3D Heated Process Vessel with Glowing Coil: ON/OFF, P, PI, PD & PID',
                category: 'Controller Tuning', icon: 'fa-temperature-high',
                aim: 'To study the performance of ON-OFF, P, PI, PD, and PID controllers on a Thermal Process System (Set Point = 50 °C).',
                apparatus: ['Computerized Temperature Control 3D Trainer with Heating Coil', 'Thyristor Power Controller & RTD (Pt-100) Sensor'],
                procedure: [
                    'Set Set Point = 50 °C. Test ON/OFF (Gap = 10 °C), P (Kp = 3), PI (Kp = 3, Ki = 0.01), PD (Kp = 3, Kd = 0.1), and PID.',
                    'Observe the 3D immersion heater coil glowing intensity dynamically changing with controller power output.'
                ]
            },
            {
                id: 'exp10', no: 'Ex. No. 10', title: 'Tuning of a Pressure System',
                subtitle: '3D Pneumatic Pressure Tank & Dial Gauge: ON/OFF, P, PI, PD & PID',
                category: 'Controller Tuning', icon: 'fa-gauge-high',
                aim: 'To study the response of ON-OFF, P, PI, PD, and PID controllers on a Pressure Process System (Set Point = 35 Psi).',
                apparatus: ['Computerized Pressure Process Control 3D Trainer', 'Compressed Air Supply, Regulator, Pressure Vessel & PT Sensor'],
                procedure: [
                    'Set Set Point = 35 Psi. Run ON/OFF (Gap = 20 Psi), P (Kp = 2), PI (Kp = 2, Ki = 0.01), PD (Kp = 2, Kd = 0.1), and PID (Kp = 3, Ki = 0.01, Kd = 0.1).',
                    'Watch the 3D Bourdon pressure gauge needle and pneumatic control valve respond in real time.'
                ]
            },
            {
                id: 'exp11', no: 'Ex. No. 11', title: 'Flow Co-efficient of Control Valves',
                subtitle: '3D Equal Percentage Pneumatic Control Valve & Rangeability',
                category: 'Final Control Elements', icon: 'fa-faucet',
                aim: 'To study the flow characteristics of an Equal Percentage Control Valve and determine its flow coefficient / Rangeability (m_max / m_min).',
                apparatus: ['Control Valve Characteristics 3D Test Rig', 'Air Compressor & Regulator (3–15 psi)', 'Equal Percentage Control Valve & Rotameter'],
                procedure: [
                    'Adjust air regulator pressure across 15, 12, 9, 6, and 3 psi (or click the 3D valve actuator) and record stem opening (%) and flow rate (LPH).',
                    'Plot % Flow Rate vs % Stem Opening and compute Rangeability = m_max / m_min.'
                ]
            },
            {
                id: 'exp12', no: 'Ex. No. 12', title: 'Characteristics of Different Control Valves',
                subtitle: '3D Parallel Manifold: Quick Opening, Linear & Equal % Valves (HV1–HV7)',
                category: 'Final Control Elements', icon: 'fa-chart-line',
                aim: 'To study and compare the inherent flow characteristics and valve gain of Quick Opening (ON-OFF), Linear, and Equal Percentage control valves.',
                apparatus: ['Multi-Valve 3D Manifold Rig (ON-OFF, Linear, Equal % Valves)', 'Hand Valves HV1–HV7, Rotameter, Pressure Gauges & Air Regulator'],
                procedure: [
                    'Select each valve branch (Quick Opening, Linear, Equal Percentage) — notice the 3D isolation hand valves HV1–HV7 automatically switch branches.',
                    'Vary regulator pressure (3–15 psi) and compare % Cv curves and Valve Gain.'
                ]
            },
            {
                id: 'exp13', no: 'Ex. No. 13', title: 'Response of Second Order System',
                subtitle: '3D Glass U-Tube Manometer Step Response & Mercury Oscillation',
                category: 'Open Loop Dynamics', icon: 'fa-wave-square',
                aim: 'To study the under-damped dynamic response of a U-Tube Manometer following a step pressure change, compute overshoot, decay ratio, rise time, and response time, and establish its transfer function.',
                apparatus: ['3D U-Tube Manometer Experimental Setup with Pressure Transmitter', 'Hand Pressure Pump & Release Valve', 'Data Acquisition System & PC'],
                procedure: [
                    'Apply a sudden step pressure input to Leg 1 using the hand pump (click the 3D pump bulb or adjust parameters).',
                    'Watch the 3D manometric fluid column oscillate between Leg 1 and Leg 2 until settling at steady height H(s).',
                    'Evaluate τ, damping coefficient ζ, Overshoot, Decay Ratio, Rise Time t_r, and Response Time t_s.'
                ]
            },
            {
                id: 'exp14', no: 'Ex. No. 14', title: 'Closed Loop Response of Cascade Control',
                subtitle: '3D Dual-Loop Master Level (LC) + Slave Flow (FC) Trainer',
                category: 'Advanced Process Control', icon: 'fa-project-diagram',
                aim: 'To study the closed-loop performance of a Cascade Control System where Primary Level Controller (LC) manipulates the set point of Secondary Flow Controller (FC) to reject supply disturbances rapidly.',

                    'Select Cascade Mode (PID vs ON-OFF), set Primary Level SP, and inject a supply pressure disturbance surge.',

            {

                category: 'Closed Loop Calibration', icon: 'fa-thermometer-half',

                procedure: [

                    'Step Manual Mode output across 0% to 100% and verify DAC, I/P, and 3D valve linearity.'
                ]
            },
            {
                id: 'viva', no: 'Viva Bank', title: 'Viva Questions & Answers (40 Q&A)',
                subtitle: 'Complete Examination Oral Reference from CH3711 Lab Manual',
                category: 'Exam Preparation', icon: 'fa-book-open',
                aim: 'Comprehensive oral examination preparation covering all 40 official viva questions from the CH3711 Process Control Lab Manual.',
                apparatus: ['CH3711 Regulation 2021 Lab Manual Reference'],
                procedure: ['Use the search bar below to filter all 40 official Viva questions by keyword.']
            }
        ];

        const VIVA_QUESTIONS = [
            { q: "1. Define open loop system.", a: "A system which generates output signals depending on the integrity of the system to execute them, without feedback for monitoring or comparison purposes. Open-loop systems ignore error signals and operate on the assumption that no errors occur." },
            { q: "2. What is a first order system?", a: "Any physical system for which the relation between Laplace transforms of input and output deviation variables is of the form Y(s)/X(s) = 1 / (τs + 1) is called a first order system, where 'τ' is the time constant of the system with units of time." },
            { q: "3. What are the assumptions used in developing the transfer function for a thermometer?", a: "(1) All resistance to heat transfer resides in the film surrounding the bulb (glass & mercury resistance neglected). (2) All thermal capacity is in the mercury with uniform temperature throughout. (3) The glass wall does not expand or contract during transient response." },
            { q: "4. List different forcing functions.", a: "Step function: X(t) = A·u(t); Impulse function: X(t) = A·δ(t); Sinusoidal input: X(t) = A·sin(ωt)." },
            { q: "5. Define resistance and capacitance of a first order system.", a: "Resistance is defined as the ratio of the change in driving force to the change in flow. Capacitance is defined as the ratio of the change in storage to the change in driving force." },
            { q: "6. Write the units of resistance and capacitance in a thermometer.", a: "Resistance = 1/(hA) has SI unit [K·s/kJ]. Capacitance = m·Cp has SI unit [kJ/K]." },
            { q: "7. Write the variables in second order transfer function.", a: "In Y(s)/X(s) = 1 / [τ²s² + 2ζτs + 1], 'τ' is the characteristic time (units of time) and 'ζ' is the dimensionless damping coefficient." },
            { q: "8. Define critically damped system and write the transfer function for the same.", a: "If damping coefficient ζ = 1, the second-order system is critically damped, providing the most rapid approach to steady state without oscillation: Y(s)/X(s) = 1 / (τs + 1)²." },
            { q: "9. 'Two first order systems connected in series is an over-damped second order system' – Justify.", a: "Its transfer function is Y(s)/X(s) = 1 / [(τ₁s + 1)(τ₂s + 1)] = 1 / [τ²s² + 2ζτs + 1]. Since roots s₁ and s₂ are real and distinct (for τ₁ ≠ τ₂), ζ = (τ₁+τ₂)/(2√(τ₁τ₂)) > 1, producing a non-oscillatory overdamped response." },
            { q: "10. What is loading in an interacting system?", a: "The term 'Interacting' is referred to as 'Loading' because the second tank's liquid head affects the flow out of the first tank. This coupling changes the effective time constants and makes the response more sluggish." },
            { q: "11. What is overshoot?", a: "Overshoot is a measure of how much the under-damped step response exceeds its ultimate steady-state value: Overshoot = exp[−πζ / √(1 − ζ²)]." },
            { q: "12. Define decay ratio.", a: "Decay ratio is the ratio of the sizes of successive peaks in an under-damped step response: Decay Ratio = exp[−2πζ / √(1 − ζ²)] = (Overshoot)²." },
            { q: "13. Define rise time and response time.", a: "Rise time (t_r) is the time required for the under-damped response to first reach its ultimate value. Response time (t_s) is the time required for the response to enter and remain within ±5% of its ultimate value." },
            { q: "14. What are the components of a feedback control system?", a: "(i) Process, (ii) Measuring element (Sensor/Transmitter), (iii) Controller, and (iv) Final control element (Control Valve)." },
            { q: "15. Explain negative and positive feedback systems.", a: "In Negative Feedback, the error signal is the difference between set point and measured variable (e = SP − PV), driving the system to reduce error. In Positive Feedback, the signals are added, making the system inherently unstable." },
            { q: "16. Why is negative feedback invariably preferred in closed loop systems?", a: "Negative feedback ensures corrective action always opposes error deviation to maintain stability, whereas positive feedback reinforces error and causes runaway instability." },
            { q: "17. Write the closed loop equation for a feedback control system.", a: "C(s)/R(s) = G(s) / [1 + G(s)H(s)], where G(s) = G_c(s)·G_v(s)·G_p(s) is the forward path transfer function and H(s) is the measuring element transfer function." },
            { q: "18. Define load and set-point variable.", a: "Load variable (U) represents external disturbances entering the process (analyzed with R = 0). Set-point variable (R) is the desired target value of the controlled variable (analyzed with U = 0)." },
            { q: "19. Distinguish between servo and regulator problem.", a: "Servo problem studies transient response when Set Point R changes at constant load (dU/dt = 0). Regulator problem studies response when Load U changes at constant Set Point (dR/dt = 0)." },
            { q: "20. Explain the mechanism of a pneumatic control valve.", a: "A pneumatic control valve uses a spring-and-diaphragm actuator. Controller air pressure (3–15 psi) acts on the diaphragm against spring force, positioning the valve plug linearly to regulate fluid flow." },
            { q: "21. Distinguish quick opening, linear, and equal percentage valve characteristics.", a: "Linear valve has constant sensitivity dm/dx = α. Quick opening gives large flow change at small stem lift. Equal percentage has increasing sensitivity dm/dx = β·m, where equal increments of lift produce equal percentage changes in flow." },
            { q: "22. Define rangeability of a control valve.", a: "Rangeability is the ratio of maximum controllable flow to minimum controllable flow over which the valve follows its inherent characteristic: Rangeability = m_max / m_min." },
            { q: "23. List disadvantages of a pneumatic controller.", a: "(1) Higher installation/air-supply maintenance cost, (2) Transmission lag over long distances, and (3) Mechanical knob calibration required for gain, integral, and derivative settings." },
            { q: "24. What is proportional band? Explain reset rate.", a: "Proportional band (PB = 100/Kp %) is the percentage error required to move the control valve from fully closed to fully open. Reset rate is the reciprocal of integral time (1 / τ_I)." },
            { q: "25. Give the importance of integral mode in a PI controller.", a: "Integral action integrates error over time, completely eliminating steady-state Offset inherent to proportional-only control, though it introduces slightly more oscillatory behavior." },
            { q: "26. Give the importance of derivative mode in a PD controller.", a: "Derivative action responds to the rate of change of error (de/dt), providing anticipatory braking that reduces overshoot and settling time with minimal oscillation." },
            { q: "27. Write short notes on On-Off control.", a: "On-Off control (two-position control) is a special case of proportional control with extremely high gain (zero bandwidth). The final control element switches abruptly between 100% ON and 0% OFF around a differential gap." },
            { q: "28. Define offset. What type of controller eliminates offset?", a: "Offset is the sustained steady-state deviation between the Set Point and Process Variable after a load or set-point change in a P-only controller. Adding Integral mode (PI or PID controller) eliminates offset." },
            { q: "29. Write the transfer function of a PID controller.", a: "P(s) / ε(s) = Kc [ 1 + τ_D·s + 1/(τ_I·s) ], where Kc = proportional gain, τ_I = integral time, and τ_D = derivative time." },
            { q: "30. Explain transportation lag or delay.", a: "Transportation lag (dead time, τ_d) is the time required for fluid to travel from pipe inlet to outlet: τ_d = Pipe Volume / Volumetric Flow Rate. Its transfer function is e^(−τ_d·s)." },
            { q: "31. When do we go for advanced control schemes?", a: "When simple single-loop feedback control fails to give satisfactory performance due to large, frequent load disturbances or significant dead time." },
            { q: "32. Define 'Cascade control'.", a: "Cascade control uses two controllers in nested loops: the Primary (Master) controller adjusts the set point of a Secondary (Slave) controller, which directly drives the control valve to reject inner-loop disturbances rapidly." },
            { q: "33. Give an example for cascade control.", a: "Temperature control of a jacketed chemical reactor: the Primary reactor temperature controller sets the set point for the Secondary jacket coolant flow controller." },
            { q: "34. Explain the importance of Cascade control.", a: "The fast inner loop detects and corrects supply disturbances (such as header pressure fluctuations) immediately before they propagate into the slow primary process." },
            { q: "35. Distinguish between feedback and feed-forward control.", a: "Feedback reacts only after an error has occurred in the controlled variable. Feed-forward measures load disturbances directly at the source and takes corrective action before the controlled variable deviates." },
            { q: "36. When is feed-forward control used? Explain its advantages.", a: "Used when major load disturbances can be measured online in systems with large dead times. It corrects disturbances proactively before process upset occurs." },
            { q: "37. Give examples of systems where feed-forward control is used.", a: "Heat exchanger steam flow control based on inlet fluid flow/temperature, distillation column feed-forward control, CSTR temperature control, and boiler drum level control." },
            { q: "38. Write the limitations of feed-forward control.", a: "(1) Corrects only for measured disturbances, (2) Requires an accurate mathematical process model, and (3) Cannot compensate for unmeasured parameter drift (usually paired with feedback trim)." },
            { q: "39. Give the elements of a computer control system.", a: "Process, Measuring Element, ADC (Analog-to-Digital Converter), Microprocessor/PC Controller, DAC (Digital-to-Analog Converter), and Final Control Element." },
            { q: "40. What is an analog to digital converter (ADC)?", a: "An ADC converts continuous analog sensor signals (4–20 mA or 1–5 V) into discrete digital numbers readable by a computer, while a DAC converts digital controller outputs back to 4–20 mA analog signals." }
        ];

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const colors = {
                info: 'bg-slate-800 text-white border-slate-700',
                success: 'bg-emerald-600 text-white border-emerald-500',
                warning: 'bg-amber-600 text-white border-amber-500'
            };
            toast.className = `pointer-events-auto flex items-center gap-2.5 px-4 py-3 rounded-xl shadow-lg border text-xs font-medium transition-all duration-300 transform translate-y-2 opacity-0 ${colors[type] || colors.info}`;
            toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-info-circle'}"></i><span>${message}</span>`;
            container.appendChild(toast);
            requestAnimationFrame(() => toast.classList.remove('translate-y-2', 'opacity-0'));
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3200);
        }

        function initThreeEngine(containerEl) {
            // Clean up previous renderer if re-mounting
            if (threeLab.renderer && threeLab.renderer.domElement && threeLab.renderer.domElement.parentNode) {
                threeLab.renderer.domElement.parentNode.removeChild(threeLab.renderer.domElement);
            }

            const width = containerEl.clientWidth || 600;
            const height = containerEl.clientHeight || 420;
            const isDark = document.documentElement.classList.contains('dark');

            if (!threeLab.scene) {
                threeLab.scene = new THREE.Scene();
                threeLab.camera = new THREE.PerspectiveCamera(42, width / height, 0.1, 100);
                threeLab.camera.position.set(5.2, 3.8, 6.8);

                threeLab.renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
                threeLab.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                threeLab.renderer.shadowMap.enabled = true;
                threeLab.renderer.shadowMap.type = THREE.PCFSoftShadowMap;

                // Studio Three-Point Lighting
                const hemiLight = new THREE.HemisphereLight(0xffffff, 0x334155, 0.85);
                threeLab.scene.add(hemiLight);

                const dirLight = new THREE.DirectionalLight(0xffffff, 1.1);
                dirLight.position.set(6, 10, 7);
                dirLight.castShadow = true;
                dirLight.shadow.mapSize.width = 1024;
                dirLight.shadow.mapSize.height = 1024;
                threeLab.scene.add(dirLight);

                const rimLight = new THREE.DirectionalLight(0x38bdf8, 0.45);
                rimLight.position.set(-6, 5, -6);
                threeLab.scene.add(rimLight);

                // Lab Floor Grid & Skids Base
                const gridHelper = new THREE.GridHelper(16, 24, 0x64748b, 0x94a3b8);
                gridHelper.material.opacity = 0.25;
                gridHelper.material.transparent = true;
                threeLab.scene.add(gridHelper);

                threeLab.rigGroup = new THREE.Group();
                threeLab.scene.add(threeLab.rigGroup);
            }

            threeLab.scene.background = new THREE.Color(isDark ? 0x0b1120 : 0xe2e8f0);
            threeLab.scene.fog = new THREE.FogExp2(isDark ? 0x0b1120 : 0xe2e8f0, 0.032);
            threeLab.renderer.setSize(width, height);
            containerEl.appendChild(threeLab.renderer.domElement);

            // OrbitControls
            threeLab.controls = new THREE.OrbitControls(threeLab.camera, threeLab.renderer.domElement);
            threeLab.controls.enableDamping = true;
            threeLab.controls.dampingFactor = 0.06;

            threeLab.controls.maxDistance = 15;

        function onThreeResize() {
            const wrapper = document.getElementById('three-canvas-wrapper');
            if (!wrapper || !threeLab.renderer || !threeLab.camera) return;
            const w = wrapper.clientWidth;
            const h = wrapper.clientHeight;
            threeLab.camera.aspect = w / h;
            threeLab.camera.updateProjectionMatrix();
            threeLab.renderer.setSize(w, h);
        }

        function setCameraPreset(preset) {
            if (!threeLab.camera || !threeLab.controls) return;
            const targets = {
                iso: { pos: [5.2, 3.8, 6.8], target: [0, 1.5, 0] },
                front: { pos: [0, 2.2, 7.6], target: [0, 1.6, 0] },
                top: { pos: [0, 7.8, 1.8], target: [0, 1.2, 0] },
                valve: { pos: [2.2, 2.1, 3.2], target: [0.3, 1.3, 0.2] }
            };
            const t = targets[preset] || targets.iso;
            threeLab.camera.position.set(...t.pos);
            threeLab.controls.target.set(...t.target);
            threeLab.controls.update();
        }

        // Direct 3D Raycast Interaction (Click handwheel or pump in 3D scene)
        function onThreePointerDown(event) {
            const rect = threeLab.renderer.domElement.getBoundingClientRect();
            threeLab.mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            threeLab.mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

            threeLab.raycaster.setFromCamera(threeLab.mouse, threeLab.camera);
            const hits = threeLab.raycaster.intersectObjects(threeLab.interactables, true);
            if (hits.length > 0) {
                let obj = hits[0].object;
                while (obj && !obj.userData.action && obj.parent) {
                    obj = obj.parent;
                }
                if (obj && obj.userData.action) {
                    obj.userData.action();
                }
            }
        }

        // Helper Builders for 3D Industrial Process Components
        function createLabBenchBase(width = 5.4, depth = 2.6) {
            const group = new THREE.Group();
            const table = new THREE.Mesh(new THREE.BoxGeometry(width, 0.16, depth), MATS.darkFrame);
            table.position.y = 0.08;
            table.receiveShadow = true;
            group.add(table);

            // Sump reservoir underneath
            const sump = new THREE.Mesh(new THREE.BoxGeometry(width * 0.7, 0.35, depth * 0.65), MATS.acrylic);
            sump.position.set(0, 0.33, 0);
            group.add(sump);
            const sumpWater = new THREE.Mesh(new THREE.BoxGeometry(width * 0.68, 0.24, depth * 0.63), MATS.waterBlue);
            sumpWater.position.set(0, 0.28, 0);
            group.add(sumpWater);

            // Centrifugal Feed Pump on left
            const pumpGroup = new THREE.Group();
            pumpGroup.position.set(-width * 0.38, 0.42, 0.45);
            const motor = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 0.45, 20), MATS.actuatorBlue);
            motor.rotation.z = Math.PI / 2;
            const volute = new THREE.Mesh(new THREE.CylinderGeometry(0.26, 0.26, 0.16, 20), MATS.steel);
            volute.rotation.x = Math.PI / 2;
            volute.position.x = 0.28;
            const impeller = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.06, 0.18), MATS.brass);
            impeller.position.set(0.28, 0, 0.09);
            pumpGroup.add(motor, volute, impeller);
            group.add(pumpGroup);
            threeLab.animState.meshes.impeller = impeller;

            return group;
        }

        function createCylindricalTank(radius = 0.65, height = 2.1, waterMat = MATS.waterBlue) {
            const tankGroup = new THREE.Group();
            // Flanges top & bottom
            const botFlange = new THREE.Mesh(new THREE.CylinderGeometry(radius + 0.06, radius + 0.06, 0.08, 32), MATS.darkFrame);
            const topFlange = new THREE.Mesh(new THREE.CylinderGeometry(radius + 0.06, radius + 0.06, 0.06, 32), MATS.darkFrame);
            topFlange.position.y = height;

            // Acrylic Cylinder
            const shell = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, height, 32, 1, true), MATS.acrylic);
            shell.position.y = height / 2;

            // Graduated Level Scale Strip
            const scaleBar = new THREE.Mesh(new THREE.BoxGeometry(0.05, height * 0.92, 0.02), new THREE.MeshBasicMaterial({ color: 0xf8fafc }));
            scaleBar.position.set(0, height / 2, radius + 0.01);

            // Dynamic Water Cylinder (scaled from bottom)
            const waterGeo = new THREE.CylinderGeometry(radius - 0.025, radius - 0.025, 1, 32);
            waterGeo.translate(0, 0.5, 0); // Pivot at bottom!
            const waterMesh = new THREE.Mesh(waterGeo, waterMat);
            waterMesh.position.y = 0.04;
            waterMesh.scale.y = 0.45 * height;

            tankGroup.add(botFlange, topFlange, shell, scaleBar, waterMesh);
            return { group: tankGroup, waterMesh, height };
        }

        function createRotameter(height = 1.1) {
            const g = new THREE.Group();
            const tube = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.07, height, 20), MATS.acrylic);
            const capTop = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.11, 0.08, 20), MATS.steel);
            capTop.position.y = height / 2;
            const capBot = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.11, 0.08, 20), MATS.steel);
            capBot.position.y = -height / 2;
            const bob = new THREE.Mesh(new THREE.ConeGeometry(0.055, 0.12, 16), MATS.valveRed);
            bob.rotation.x = Math.PI;
            g.add(tube, capTop, capBot, bob);
            return { group: g, bob, height };
        }

        function createHandValve(colorMat = MATS.valveRed, onClickAction = null) {
            const g = new THREE.Group();
            const body = new THREE.Mesh(new THREE.SphereGeometry(0.13, 16, 16), MATS.brass);
            const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.22, 12), MATS.steel);
            stem.position.y = 0.16;
            const wheel = new THREE.Mesh(new THREE.TorusGeometry(0.14, 0.022, 10, 24), colorMat);
            wheel.rotation.x = Math.PI / 2;
            wheel.position.y = 0.27;
            const spoke = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.02, 0.025), colorMat);
            spoke.position.y = 0.27;
            g.add(body, stem, wheel, spoke);

            if (onClickAction) {
                g.userData.action = onClickAction;
                threeLab.interactables.push(g);
            }
            return { group: g, wheel, spoke };
        }

        function createPneumaticControlValve(onClickAction = null) {
            const g = new THREE.Group();
            // Valve Body
            const body = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.16, 0.32, 16), MATS.steel);
            body.rotation.z = Math.PI / 2;
            // Yoke Pillars
            const yokeL = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.42, 10), MATS.darkFrame);
            yokeL.position.set(-0.1, 0.28, 0);
            const yokeR = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.42, 10), MATS.darkFrame);
            yokeR.position.set(0.1, 0.28, 0);
            // Moving Stem & Travel Indicator
            const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.36, 12), MATS.brass);
            stem.position.y = 0.24;
            const pointer = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.03, 0.04), MATS.valveRed);
            pointer.position.y = 0.24;
            // Diaphragm Actuator Dome
            const dome = new THREE.Mesh(new THREE.CylinderGeometry(0.26, 0.28, 0.16, 24), MATS.actuatorBlue);
            dome.position.y = 0.54;
            const domeCap = new THREE.Mesh(new THREE.SphereGeometry(0.26, 24, 12, 0, Math.PI * 2, 0, Math.PI / 2), MATS.actuatorBlue);
            domeCap.position.y = 0.62;

            g.add(body, yokeL, yokeR, stem, pointer, dome, domeCap);
            if (onClickAction) {
                g.userData.action = onClickAction;
                threeLab.interactables.push(g);
            }
            return { group: g, stem, pointer };
        }

        function createPipeSegment(p1, p2, radius = 0.045, mat = MATS.pipeActive) {
            const v1 = new THREE.Vector3(...p1);
            const v2 = new THREE.Vector3(...p2);
            const dist = v1.distanceTo(v2);
            const cyl = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, dist, 14), mat);
            cyl.position.copy(v1).add(v2).multiplyScalar(0.5);
            cyl.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), v2.clone().sub(v1).normalize());
            return cyl;
        }

        function register3DCallout(id, label, positionVec3, colorClass = 'bg-sky-600') {
            threeLab.callouts.push({ id, label, pos: positionVec3, colorClass });
        }

        // 60 FPS Animation Loop for 3D Equipment & Floating Screen-Space Callouts
        function animateThreeLab() {
            requestAnimationFrame(animateThreeLab);
            if (!threeLab.renderer || !threeLab.scene || !threeLab.camera) return;

            const dt = threeLab.clock.getDelta();
            const st = threeLab.animState;
            const m = st.meshes;

            // Rotate pump impeller proportional to flowrate
            if (m.impeller) {
                m.impeller.rotation.z += dt * (2 + (st.flowLPH / 500) * 14);
            }

            // Rotate handwheel gently with flow setting
            if (m.handWheel) {
                m.handWheel.rotation.z = (st.flowLPH / 500) * Math.PI * 2;
            }

            // Move Rotameter bob vertically with flowrate
            if (m.bob && m.rotaH) {
                const normF = Math.max(0.05, Math.min(0.95, st.flowLPH / st.maxFlowLPH));
                const targetY = -m.rotaH * 0.42 + normF * (m.rotaH * 0.84);
                m.bob.position.y += (targetY - m.bob.position.y) * 0.15;
            }

            // Smoothly animate Tank 1 & Tank 2 liquid levels
            if (m.water1 && m.tank1H) {
                const targetScale1 = Math.max(0.08, Math.min(0.92, st.h1Frac)) * m.tank1H;
                m.water1.scale.y += (targetScale1 - m.water1.scale.y) * 0.12;
            }
            if (m.water2 && m.tank2H) {
                const targetScale2 = Math.max(0.08, Math.min(0.92, st.h2Frac)) * m.tank2H;
                m.water2.scale.y += (targetScale2 - m.water2.scale.y) * 0.12;
            }

            // Pneumatic Control Valve Stem Travel
            if (m.valveStem && m.valvePointer) {
                const lift = 0.16 + st.valveOpen * 0.18;
                m.valveStem.position.y += (lift - m.valveStem.position.y) * 0.15;
                m.valvePointer.position.y = m.valveStem.position.y;
            }

            // Pressure Gauge Needle Rotation (Ex 6 & 10)
            if (m.gaugeNeedle) {
                const angle = Math.PI * 0.75 - (st.pressurePsi / 60) * Math.PI * 1.5;
                m.gaugeNeedle.rotation.z += (angle - m.gaugeNeedle.rotation.z) * 0.15;
            }

            // Thermal Heater Coil Glow Intensity (Ex 9 & 15)
            if (m.heaterCoil) {
                m.heaterCoil.material.emissiveIntensity = 0.25 + st.heaterPower * 1.4;
            }

            // 3-Branch Manifold Highlight (Ex 12)
            if (m.branches) {
                m.branches.forEach((b, idx) => {
                    const isActive = idx === st.branchIndex;
                    b.hv.wheel.rotation.z = isActive ? Math.PI / 2 : 0;
                    b.cv.stem.position.y = isActive ? (0.16 + st.valveOpen * 0.18) : 0.16;
                    b.cv.pointer.position.y = b.cv.stem.position.y;
                });
            }

            // U-Tube Manometer Real-Time Under-Damped Oscillation (Ex 13)
            if (m.mercL && m.mercR && st.expId === 'exp13') {
                const elapsed = (performance.now() - (st.manometerPulseTime || 0)) / 1000;
                const zeta = parseFloat(document.getElementById('e13-z')?.value || 0.25);
                const L = parseFloat(document.getElementById('e13-l')?.value || 1.2);
                const tau = Math.sqrt((2 * L) / (3 * 9.81));
                const sq = Math.sqrt(1 - zeta * zeta);
                const omega = sq / tau;
                const phi = Math.atan(sq / zeta);
                const yt = 1 - (1 / sq) * Math.exp((-zeta * elapsed) / tau) * Math.sin(omega * elapsed + phi);
                const disp = 0.42 * yt;
                m.mercL.scale.y = Math.max(0.25, 0.85 - disp);
                m.mercR.scale.y = Math.max(0.25, 0.85 + disp);
            }

            if (threeLab.controls) threeLab.controls.update();
            threeLab.renderer.render(threeLab.scene, threeLab.camera);
            update3DCalloutOverlays();
        }

        function update3DCalloutOverlays() {
            const overlayContainer = document.getElementById('three-callout-layer');

            const w = wrapper.clientWidth;
            const h = wrapper.clientHeight;
            let html = '';

            threeLab.callouts.forEach(c => {
                const proj = c.pos.clone().project(threeLab.camera);
                if (proj.z < 1) {
                    const x = (proj.x * 0.5 + 0.5) * w;
                    const y = (-proj.y * 0.5 + 0.5) * h;
                    if (x > 20 && x < w - 20 && y > 20 && y < h - 10) {
                        const liveVal = c.liveText || c.label;
                        html += `
                            <div class="callout-3d" style="left:${x}px; top:${y}px;">
                                <span class="px-2 py-0.5 rounded-md text-[10px] font-mono font-bold text-white shadow-md whitespace-nowrap ${c.colorClass}">

        function updateExp1() {
            const X = parseFloat(document.getElementById('e1-x').value);

            const C = parseFloat(document.getElementById('e1-c').value);
            const R_cm = parseFloat(document.getElementById('e1-r').value);

            document.getElementById('e1-x-val').textContent = X;
            document.getElementById('e1-y-val').textContent = Y;
            document.getElementById('e1-c-val').textContent = C;
            document.getElementById('e1-r-val').textContent = R_cm.toFixed(2);

            const qX = (X * 1000) / 3600;
            const qY = (Y * 1000) / 3600;
            const h0 = qX * R_cm;
            const hInf = qY * R_cm;
            const tau = R_cm * C;
            const h632 = h0 + 0.632 * (hInf - h0);
            const R_SI = R_cm * 10000;

            // Update 3D Rig Live Parameters & Callouts
            threeLab.animState.flowLPH = Y;
            threeLab.animState.h1Frac = Math.min(0.92, hInf / 35);
            const cFlow = threeLab.callouts.find(c => c.id === 'flow');
            const cLvl = threeLab.callouts.find(c => c.id === 'lvl1');
            if (cFlow) cFlow.liveText = `Inflow: ${Y} LPH`;
            if (cLvl) cLvl.liveText = `Steady h∞: ${hInf.toFixed(1)} cm`;

            const totalTime = Math.ceil((tau * 4.5) / 10) * 10;
            const dt = Math.max(2, Math.round(totalTime / 20));
            const labels = [], dataH = [], data632 = [], rows = [];
            let sno = 1;
            for (let t = 0; t <= totalTime; t += dt) {
                const h = h0 + (hInf - h0) * (1 - Math.exp(-t / tau));
                const pct = ((h - h0) / (hInf - h0)) * 100;
                labels.push(t);
                dataH.push(Number(h.toFixed(2)));
                data632.push(Number(h632.toFixed(2)));
                rows.push([sno++, t, h.toFixed(2), pct.toFixed(1) + '%']);
            }

            document.getElementById('e1-table-body').innerHTML = rows.map(r => `

            document.getElementById('e1-res-tau').textContent = `${tau.toFixed(2)} sec`;
            document.getElementById('e1-res-r').textContent = `${R_SI.toFixed(0)} s/m²`;
            document.getElementById('e1-tf-box').textContent = `G(s) = ${R_SI.toFixed(0)} / (${tau.toFixed(1)}s + 1)`;

            const calcLines = [

                `5. Resistance R = ${R_SI.toFixed(0)} s/m²`

                    ]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { labels: { color: colors.text } } },
                    scales: {

                result: `(i) Time constant for level process tank τ = ${tau.toFixed(2)} sec\n(ii) Resistance for level process tank R = ${R_SI.toFixed(0)} s/m²`,
                chartCanvasId: 'chart-exp1'

        function updateExp2() {

            document.getElementById('e2-y-val').textContent = Y;
            document.getElementById('e2-t1-val').textContent = tau1;
            document.getElementById('e2-t2-val').textContent = tau2;

            const C = 400, R1 = tau1 / C, R2 = tau2 / C;
            const qX = (X * 1000) / 3600, qY = (Y * 1000) / 3600;
            const h1_0 = qX * R1, h1_inf = qY * R1, h2_0 = qX * R2, h2_inf = qY * R2;

            threeLab.animState.flowLPH = Y;
            threeLab.animState.h1Frac = Math.min(0.92, h1_inf / 25);
            threeLab.animState.h2Frac = Math.min(0.92, h2_inf / 25);
            const c1 = threeLab.callouts.find(c => c.id === 'lvl1');
            const c2 = threeLab.callouts.find(c => c.id === 'lvl2');
            if (c1) c1.liveText = `Tank 1: ${h1_inf.toFixed(1)} cm`;
            if (c2) c2.liveText = `Tank 2: ${h2_inf.toFixed(1)} cm`;

            const totalTime = Math.ceil(((tau1 + tau2) * 3.5) / 10) * 10;
            const dt = Math.max(5, Math.round(totalTime / 18));
            const labels = [], dataH1 = [], dataH2 = [], rows = [];
            let sno = 1;
            for (let t = 0; t <= totalTime; t += dt) {
                const h1 = h1_0 + (h1_inf - h1_0) * (1 - Math.exp(-t / tau1));
                const frac2 = Math.abs(tau1 - tau2) < 0.01 ? 1 - (1 + t / tau1) * Math.exp(-t / tau1) : 1 - ((tau1 * Math.exp(-t / tau1) - tau2 * Math.exp(-t / tau2)) / (tau1 - tau2));
                const h2 = h2_0 + (h2_inf - h2_0) * frac2;
                labels.push(t); dataH1.push(Number(h1.toFixed(2))); dataH2.push(Number(h2.toFixed(2)));

                <div class="bg-amber-50 dark:bg-amber-950/50 p-2.5 rounded-xl">R₂ = <b>${(R2 * 10000).toFixed(0)} s/m²</b></div>

            }));

        function updateExp3() {
            const X = parseFloat(document.getElementById('e3-x').value);

            document.getElementById('e3-t1-val').textContent = t1;

            const C = 400, R1 = t1 / C, R2 = t2 / C;
            const qX = (X * 1000) / 3600, qY = (Y * 1000) / 3600;
            const h1_0 = qX * (R1 + R2), h1_inf = qY * (R1 + R2);
            const h2_0 = qX * R2, h2_inf = qY * R2;

            const b = t1 + 2 * t2, ac = t1 * t2, disc = Math.sqrt(b * b - 4 * ac);
            const tauEff1 = (b + disc) / 2, tauEff2 = (b - disc) / 2;

            threeLab.animState.flowLPH = Y;
            threeLab.animState.h1Frac = Math.min(0.92, h1_inf / 35);
            threeLab.animState.h2Frac = Math.min(0.92, h2_inf / 35);

            if (c2) c2.liveText = `Tank 2: ${h2_inf.toFixed(1)} cm`;

            const totalTime = Math.ceil((tauEff1 * 3.5) / 10) * 10;
            const dt = Math.max(5, Math.round(totalTime / 18));
            const labels = [], dataH1 = [], dataH2 = [], rows = [];
            let h1 = h1_0, h2 = h2_0, nextSample = 0, sno = 1;
            for (let t = 0; t <= totalTime + 0.1; t += 0.2) {
                if (t >= nextSample - 0.05) {
                    labels.push(Math.round(nextSample));
                    dataH1.push(Number(h1.toFixed(2)));
                    dataH2.push(Number(h2.toFixed(2)));
                    rows.push([sno++, Math.round(nextSample), h1.toFixed(2), h2.toFixed(2)]);
                    nextSample += dt;
                }
                const q12 = (h1 - h2) / R1;
                h1 += ((qY - q12) / C) * 0.2;

            }

            document.getElementById('e3-table-body').innerHTML = rows.map(r => `<tr><td class="p-2 border dark:border-slate-700">${r[0]}</td><td class="p-2 border dark:border-slate-700">${r[1]}</td><td class="p-2 border dark:border-slate-700 text-indigo-600 font-semibold">${r[2]}</td><td class="p-2 border dark:border-slate-700 text-emerald-600 font-semibold">${r[3]}</td></tr>`).join('');
            const calcLines = [`• Effective Slow τ_eff1 = ${tauEff1.toFixed(2)} sec`, `• Effective Fast τ_eff2 = ${tauEff2.toFixed(2)} sec`, `• R₁ = ${(R1 * 10000).toFixed(0)} s/m², R₂ = ${(R2 * 10000).toFixed(0)} s/m²`];

                <div class="bg-amber-50 dark:bg-amber-950/50 p-2.5 rounded-xl">R₂ = <b>${(R2 * 10000).toFixed(0)} s/m²</b></div>
            `;

            destroyCharts();
            const colors = getChartThemeColors();
            activeCharts.push(new Chart(document.getElementById('chart-exp3').getContext('2d'), {
                type: 'line',
                data: { labels, datasets: [{ label: 'Tank 1 h₁ (cm)', data: dataH1, borderColor: '#4f46e5', tension: 0.35 }, { label: 'Tank 2 h₂ (cm)', data: dataH2, borderColor: '#10b981', tension: 0.35 }] },

            }));

            currentSimulationData = { parameters: `X=${X} LPH, Y=${Y} LPH`, headers: ['S.No.', 'Time (s)', 'h₁ (cm)', 'h₂ (cm)'], rows, calculations: calcLines, result: `τ_eff1=${tauEff1.toFixed(2)}s, τ_eff2=${tauEff2.toFixed(2)}s, R₁=${(R1 * 10000).toFixed(0)} s/m², R₂=${(R2 * 10000).toFixed(0)} s/m²`, chartCanvasId: 'chart-exp3' };
        }

        function updateClosedLoop(domain) {
            const configs = {
                level: { varName: 'Level', unit: 'cm', min: 0, max: 30, points: [0, 5, 10, 15, 20, 25, 30], nonlinear: false },
                flow: { varName: 'Flow', unit: 'LPH', min: 0, max: 500, points: [0, 100, 200, 300, 400, 500], nonlinear: true },

            };
            const cfg = configs[domain];
            const pv = parseFloat(document.getElementById('cl-pv-slider').value);
            const man = parseFloat(document.getElementById('cl-man-slider').value);
            document.getElementById('cl-pv-val').textContent = pv;
            document.getElementById('cl-man-val').textContent = man;

            const norm = (pv - cfg.min) / (cfg.max - cfg.min);
            const txOut = cfg.nonlinear ? (4 + 16 * norm * norm) : (4 + 16 * norm);
            const txLin = 4 + 4 * Math.sqrt(Math.max(0, txOut - 4));
            const dac = 4 + 0.16 * man, ip = 3 + 0.12 * man;

            document.getElementById('cl-tx-out').textContent = `${txOut.toFixed(2)} mA`;
            document.getElementById('cl-tx-lin').textContent = cfg.nonlinear ? `${txLin.toFixed(2)} mA` : `Linear`;
            document.getElementById('cl-dac-out').textContent = `${dac.toFixed(2)}mA`;

        function setTuningMode(systemType, mode) {
            window.currentTuningMode = mode;
            document.querySelectorAll('.tune-mode-btn').forEach(btn => {
                const isSel = btn.dataset.mode === mode;
                btn.className = `tune-mode-btn py-1.5 text-xs font-bold rounded-lg border ${isSel ? 'bg-sky-600 text-white border-sky-600' : 'bg-slate-50 dark:bg-slate-800 border-slate-200 dark:border-slate-700'}`;
            });
            document.getElementById('tn-gap-box').classList.toggle('hidden', mode !== 'ONOFF');
            document.getElementById('tn-kp-box').classList.toggle('hidden', mode === 'ONOFF');
            document.getElementById('tn-ki-box').classList.toggle('hidden', !(mode === 'PI' || mode === 'PID'));
            document.getElementById('tn-kd-box').classList.toggle('hidden', !(mode === 'PD' || mode === 'PID'));
            if (systemType === 'pressure' && mode === 'PID') document.getElementById('tn-kp').value = 3.0;
            runTuningSim(systemType);
        }

        function runTuningSim(systemType) {
            const presets = {
                level: { name: 'Level', unit: 'cm', tau: 22, gain: 0.32, ambient: 0, simTime: 180 },
                flow: { name: 'Flow', unit: 'LPH', tau: 6, gain: 5.2, ambient: 0, simTime: 80 },
                thermal: { name: 'Temperature', unit: '°C', tau: 38, gain: 0.85, ambient: 28, simTime: 240 },
                pressure: { name: 'Pressure', unit: 'Psi', tau: 14, gain: 0.65, ambient: 0, simTime: 120 }
            };
            const p = presets[systemType];
            const mode = window.currentTuningMode || 'PID';
            const sp = parseFloat(document.getElementById('tn-sp').value);
            const gap = parseFloat(document.getElementById('tn-gap').value);
            const kp = parseFloat(document.getElementById('tn-kp').value);
            const ki = parseFloat(document.getElementById('tn-ki').value);
            const kd = parseFloat(document.getElementById('tn-kd').value);

            document.getElementById('tn-sp-val').textContent = sp;
            document.getElementById('tn-gap-val').textContent = gap;
            document.getElementById('tn-kp-val').textContent = kp.toFixed(1);
            document.getElementById('tn-ki-val').textContent = ki.toFixed(3);
            document.getElementById('tn-kd-val').textContent = kd.toFixed(2);
            document.getElementById('tn-chart-title').textContent = `${mode} Controller Tuning Response — ${p.name} System (SP = ${sp} ${p.unit})`;

            let pv = p.ambient, integral = 0, prevError = sp - pv, valve = 100;
            const dt = 0.5, sampleEvery = Math.round(p.simTime / 24);
            let nextSample = 0, sno = 1, settleTime = null;
            const labels = [], dataPV = [], dataSP = [], dataValve = [], rows = [];
            const spanScale = 100 / (sp * 1.6);

            for (let t = 0; t <= p.simTime; t += dt) {
                const error = sp - pv;
                if (mode === 'ONOFF') {
                    if (pv < sp - gap / 2) valve = 100;
                    else if (pv > sp + gap / 2) valve = 0;
                } else {
                    const eNorm = error * spanScale;
                    const derivNorm = ((error - prevError) / dt) * spanScale;
                    if (mode === 'PI' || mode === 'PID') {
                        integral = Math.max(-80, Math.min(80, integral + eNorm * dt * 12));
                    } else integral = 0;
                    const dTerm = (mode === 'PD' || mode === 'PID') ? (kd * 18 * derivNorm) : 0;
                    const iTerm = (mode === 'PI' || mode === 'PID') ? (ki * 22 * integral) : 0;
                    valve = Math.max(0, Math.min(100, 30 + kp * 1.4 * eNorm + iTerm + dTerm));
                }

                if (t >= nextSample - 0.01) {
                    labels.push(Math.round(nextSample));
                    dataPV.push(Number(pv.toFixed(2)));
                    dataSP.push(sp);
                    dataValve.push(Number(valve.toFixed(1)));
                    rows.push([sno++, Math.round(nextSample), pv.toFixed(2), sp, valve.toFixed(1)]);
                    nextSample += sampleEvery;
                }
                if (Math.abs(error) <= 0.03 * sp && settleTime === null && t > 5) settleTime = Math.round(t);
                else if (Math.abs(error) > 0.03 * sp) settleTime = null;

                pv += (((p.ambient + p.gain * valve) - pv) / p.tau) * dt;
                prevError = error;
            }

            const finalPV = dataPV[dataPV.length - 1];
            const finalValve = dataValve[dataValve.length - 1];
            const offset = Math.abs(sp - finalPV);

            // Sync 3D Equipment Visuals to Steady-State Output
            threeLab.animState.valveOpen = finalValve / 100;
            if (systemType === 'level') threeLab.animState.h1Frac = Math.min(0.92, finalPV / 30);
            if (systemType === 'flow') threeLab.animState.flowLPH = finalPV;
            if (systemType === 'thermal') { threeLab.animState.heaterPower = finalValve / 100; threeLab.animState.h1Frac = 0.65; }
            if (systemType === 'pressure') threeLab.animState.pressurePsi = finalPV;

            document.getElementById('tn-metric-offset').textContent = mode === 'ONOFF' ? `±${(gap / 2).toFixed(1)} ${p.unit}` : `${offset.toFixed(2)} ${p.unit}`;
            document.getElementById('tn-metric-settle').textContent = mode === 'ONOFF' ? 'Oscillating' : (settleTime ? `${settleTime} s` : `>${p.simTime} s`);
            document.getElementById('tn-table-body').innerHTML = rows.map(r => `<tr><td class="p-1.5 border dark:border-slate-700">${r[0]}</td><td class="p-1.5 border dark:border-slate-700">${r[1]}</td><td class="p-1.5 border dark:border-slate-700 text-sky-600 font-semibold">${r[2]}</td><td class="p-1.5 border dark:border-slate-700">${r[3]}</td><td class="p-1.5 border dark:border-slate-700 text-amber-600">${r[4]}%</td></tr>`).join('');

            destroyCharts();
            const colors = getChartThemeColors();
            activeCharts.push(new Chart(document.getElementById('chart-tuning').getContext('2d'), {
                type: 'line',
                data: {
                    labels,
                    datasets: [
                        { label: `PV (${p.unit})`, data: dataPV, borderColor: '#0284c7', borderWidth: 2.5, tension: 0.25, yAxisID: 'y' },
                        { label: `SP (${p.unit})`, data: dataSP, borderColor: '#10b981', borderDash: [6, 4], pointRadius: 0, yAxisID: 'y' },
                        { label: 'Valve (%)', data: dataValve, borderColor: '#f59e0b', borderWidth: 1.5, yAxisID: 'y1' }
                    ]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { labels: { color: colors.text } } },
                    scales: {
                        x: { ticks: { color: colors.text }, grid: { color: colors.grid } },
                        y: { position: 'left', ticks: { color: colors.text }, grid: { color: colors.grid } },
                        y1: { position: 'right', min: 0, max: 105, ticks: { color: '#f59e0b' }, grid: { drawOnChartArea: false } }
                    }
                }
            }));

            currentSimulationData = {
                parameters: `Mode: ${mode} | SP = ${sp} ${p.unit} | Kp=${kp}, Ki=${ki}, Kd=${kd}`,
                headers: ['S.No', 'Time(s)', `PV (${p.unit})`, `SP (${p.unit})`, 'Valve %'],
                rows, calculations: [`Mode: ${mode}, Steady PV = ${finalPV.toFixed(2)} ${p.unit}, Offset = ${offset.toFixed(2)} ${p.unit}`],
                result: `Controller tuning (${mode}) on ${p.name} system verified. Offset = ${offset.toFixed(2)} ${p.unit}.`, chartCanvasId: 'chart-tuning'
            };
        }

        function updateExp13() {
            const L = parseFloat(document.getElementById('e13-l').value);
            const zeta = parseFloat(document.getElementById('e13-z').value);
            const Hs = parseFloat(document.getElementById('e13-hs').value);
            const Hi = 10.0;
            document.getElementById('e13-l-val').textContent = L.toFixed(1);
            document.getElementById('e13-z-val').textContent = zeta.toFixed(2);
            document.getElementById('e13-hs-val').textContent = Hs.toFixed(1);

            threeLab.animState.manometerPulseTime = performance.now();

            const tau = Math.sqrt((2 * L) / (3 * 9.81));
            const sq = Math.sqrt(1 - zeta * zeta);
            const overshoot = Math.exp((-Math.PI * zeta) / sq);
            const decayRatio = overshoot * overshoot;
            const tr = (tau / sq) * (Math.PI - Math.acos(zeta));
            const ts = (Math.log(20) * tau) / zeta;
            const omega = sq / tau;

            const simDuration = Math.min(12, Math.max(3, Math.ceil(ts * 1.25)));
            const dt = Number((simDuration / 30).toFixed(2));
            const labels = [], dataY = [], rows = [];
            let sno = 1;
            for (let t = 0; t <= simDuration + 0.001; t += dt) {
                const phi = Math.atan(sq / zeta);
                const yt = 1 - (1 / sq) * Math.exp((-zeta * t) / tau) * Math.sin(omega * t + phi);
                const ht = Hi + yt * (Hs - Hi);
                labels.push(t.toFixed(2)); dataY.push(Number(yt.toFixed(3)));
                rows.push([sno++, t.toFixed(2), ht.toFixed(2), yt.toFixed(3)]);
            }

            document.getElementById('e13-table-body').innerHTML = rows.map(r => `<tr><td class="p-1.5 border">${r[0]}</td><td class="p-1.5 border">${r[1]}</td><td class="p-1.5 border text-sky-600">${r[2]}</td><td class="p-1.5 border text-emerald-600">${r[3]}</td></tr>`).join('');
            const calcLines = [`• τ = √(2L/3g) = ${tau.toFixed(3)} sec`, `• Damping Factor ζ = ${zeta.toFixed(2)}`, `• Overshoot = ${(overshoot * 100).toFixed(1)}% | Decay Ratio = ${decayRatio.toFixed(3)}`, `• Rise Time t_r = ${tr.toFixed(2)} s | Response Time t_s = ${ts.toFixed(2)} s`];
            document.getElementById('e13-calc-box').innerHTML = calcLines.map(l => `<div>${l}</div>`).join('');
            document.getElementById('e13-tf-box').textContent = `G(s) = 1 / (${(tau * tau).toFixed(3)}s² + ${(2 * tau * zeta).toFixed(3)}s + 1)`;

            destroyCharts();
            const colors = getChartThemeColors();
            activeCharts.push(new Chart(document.getElementById('chart-exp13').getContext('2d'), {
                type: 'line',
                data: { labels, datasets: [{ label: 'Normalized Response Y(t)', data: dataY, borderColor: '#0284c7', fill: true, backgroundColor: 'rgba(2,132,199,0.12)', tension: 0.35 }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { color: colors.text } } }, scales: { x: { ticks: { color: colors.text }, grid: { color: colors.grid } }, y: { ticks: { color: colors.text }, grid: { color: colors.grid } } } }
            }));

            currentSimulationData = { parameters: `L=${L}m, ζ=${zeta}, H(i)=10cm, H(s)=${Hs}cm`, headers: ['Sr.No', 'Time(s)', 'H(t) cm', 'Y(t)'], rows, calculations: calcLines, result: `G(s) = 1 / (${(tau * tau).toFixed(3)}s² + ${(2 * tau * zeta).toFixed(3)}s + 1)`, chartCanvasId: 'chart-exp13' };
        }

        function updateExp14() {
            const levelSP = parseFloat(document.getElementById('e14-lsp').value);
            const dist = parseFloat(document.getElementById('e14-dist').value);
            const mode = window.cascadeMode || 'PID';
            document.getElementById('e14-lsp-val').textContent = levelSP;
            document.getElementById('e14-dist-val').textContent = dist;
            document.getElementById('e14-tbl-mode').textContent = mode;

            threeLab.animState.h1Frac = Math.min(0.92, levelSP / 850);
            threeLab.animState.flowLPH = 120 + (levelSP / 800) * 200;

            let levelPV = 100, flowPV = 60, intL = 0, intF = 0, sno = 1;
            const labels = [], dataL = [], dataLSP = [], dataF = [], rows = [];
            for (let t = 0; t <= 120; t += 5) {
                const errL = levelSP - levelPV;
                let levelCV, flowSP, flowCV;
                if (mode === 'ONOFF') {
                    levelCV = errL > 20 ? 90 : (errL < -20 ? 10 : 50);
                    flowSP = 30 + (levelCV / 100) * 220;
                    flowCV = flowSP > flowPV ? 95 : 15;
                } else {
                    intL = Math.max(-200, Math.min(200, intL + errL * 0.2));
                    levelCV = Math.max(10, Math.min(100, 0.18 * errL + 0.04 * intL));
                    flowSP = 30 + (levelCV / 100) * 220;
                    const errF = flowSP - flowPV;
                    intF = Math.max(-100, Math.min(100, intF + errF * 0.4));
                    flowCV = Math.max(5, Math.min(100, 0.45 * errF + 0.25 * intF));
                }
                const surge = (t >= 60 && t <= 75) ? (dist * 1.4) : 0;
                flowPV += ((flowCV * 2.5 + surge - flowPV) * 0.55);
                levelPV += ((flowPV * 3.2 - levelPV) * 0.22);

                labels.push(t); dataL.push(Number(levelPV.toFixed(1))); dataLSP.push(levelSP); dataF.push(Number(flowPV.toFixed(1)));
                rows.push([sno++, t, flowSP.toFixed(1), flowPV.toFixed(1), flowCV.toFixed(1), levelSP, levelPV.toFixed(1), levelCV.toFixed(1)]);
            }

            document.getElementById('e14-table-body').innerHTML = rows.map(r => `<tr>${r.map(c => `<td class="p-1.5 border">${c}</td>`).join('')}</tr>`).join('');

            }));

            currentSimulationData = { parameters: `Cascade ${mode} | Level SP=${levelSP}mm`, headers: ['Sl.No', 'Time', 'Flow Sv', 'Flow Pv', 'Flow Cv%', 'Level Sv', 'Level Pv', 'Level Cv%'], rows, calculations: [`Primary Level SP = ${levelSP} mm, Disturbance = +${dist}%`], result: `Cascade controller (${mode}) performance studied.`, chartCanvasId: 'chart-exp14' };

                                <td colspan="2" style="border: 1px solid #94a3b8; padding: 5px;"><b>EXPERIMENT:</b> ${exp.title.toUpperCase()}</td>
                            </tr>
                        </table>

                        <div style="margin-bottom: 8px; font-size: 10.5px;"><b><u>AIM:</u></b> ${exp.aim}</div>
                        <div style="margin-bottom: 10px; font-size: 10.5px;"><b><u>APPARATUS REQUIRED:</u></b> ${exp.apparatus.join(', ')}.</div>

                        <!-- Side-by-side 3D Rig & Response Graph -->
                        ${(threeImgTag || chartImgTag) ? `<div style="display:flex; gap:10px; margin-bottom:12px;">${threeImgTag}${chartImgTag}</div>` : ''}

                        ${sim.headers.length ? `
                        <div style="margin-bottom: 10px;">
                            <div style="font-size: 11px; font-weight: 800; margin-bottom: 3px;"><u>OBSERVATION TABLE</u> (${sim.parameters}):</div>
                            <table style="width: 100%; border-collapse: collapse; font-size: 9.5px; text-align: center;">
                                <thead><tr style="background: #e2e8f0;">${sim.headers.map(h => `<th style="border: 1px solid #64748b; padding: 3.5px;">${h}</th>`).join('')}</tr></thead>
                                <tbody>${displayRows.map(r => `<tr>${r.map(c => `<td style="border: 1px solid #94a3b8; padding: 3px;">${c}</td>`).join('')}</tr>`).join('')}</tbody>
                            </table>
                        </div>` : ''}

                        ${sim.calculations.length ? `
                        <div style="margin-bottom: 10px; background: #f8fafc; border: 1px solid #cbd5e1; padding: 7px; border-radius: 4px; font-size: 10px; font-family: monospace;">
                            <b><u>CALCULATIONS:</u></b><br/>${sim.calculations.join('<br/>')}
                        </div>` : ''}

                        <div style="border: 1.5px solid #0369a1; background: #f0f9ff; padding: 8px; border-radius: 4px; font-size: 10.5px;">
                            <b style="color: #0369a1;">RESULT:</b> <span style="white-space: pre-line;">${sim.result}</span>
                        </div>

                        <div style="display: flex; justify-content: space-between; margin-top: 24px; font-size: 10.5px; font-weight: 700;">
                            <span>Signature of Student</span>
                            <span>Signature of Faculty In-Charge</span>
                        </div>
                    </div>
                `;

                const canvas = await html2canvas(renderBox, { scale: 2, useCORS: true, backgroundColor: '#ffffff' });
                const imgData = canvas.toDataURL('image/png');
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF('p', 'mm', 'a4');
                const pdfWidth = pdf.internal.pageSize.getWidth();
                const pdfHeight = pdf.internal.pageSize.getHeight();
                const imgProps = pdf.getImageProperties(imgData);
                const imgHeight = (imgProps.height * pdfWidth) / imgProps.width;

                let heightLeft = imgHeight, position = 0;
                pdf.addImage(imgData, 'PNG', 0, position, pdfWidth, imgHeight);
                heightLeft -= pdfHeight;
                while (heightLeft > 0) {
                    position = heightLeft - imgHeight;
                    pdf.addPage();
                    pdf.addImage(imgData, 'PNG', 0, position, pdfWidth, imgHeight);
                    heightLeft -= pdfHeight;
                }

                const cleanFileName = `CH3711_${exp.no.replace(/[^a-zA-Z0-9]/g, '')}_3D_Lab_Record.pdf`;
                pdf.save(cleanFileName);
                showToast(`Downloaded ${cleanFileName}`, 'success');
            } catch (err) {
                console.error(err);
                showToast('Error generating PDF.', 'warning');
            } finally {
                btn.disabled = false;
                btn.innerHTML = origHtml;
            }
        }

        // =========================================================================
        // 16. INITIALIZE ON WINDOW LOAD
        // =========================================================================
        window.onload = function () {
            updateHeaderStudentLabel();
            renderSidebar();
            selectExperiment('exp1');
            animateThreeLab();
        };
    </script>
</body>

</html>
